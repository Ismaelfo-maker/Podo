name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_bundle:
        description: 'Compilar también Android App Bundle (.aab)'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Ejecutar pruebas unitarias antes de compilar'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew

      - name: Preparar entorno (.env y debug.keystore)
        run: |
          # Asegurar archivo .env para Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Restaurar o generar debug.keystore si es necesario
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ejecutar pruebas unitarias
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests != false }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compilar App Bundle (.aab) (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_bundle == true }}
        run: ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Subir App Bundle (.aab) si se generó
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_bundle == true }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-bundle
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 14

      - name: Subir informe de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
